apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local

patches:
  - target:
      kind: Service
      name: productcatalogservice
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: productcatalogservice
      spec:
        selector:
          app: productcatalog-rotto