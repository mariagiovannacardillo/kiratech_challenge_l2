apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local

patches:
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
      spec:
        selector:
          app: app-sbagliata-per-test