apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local

# Imposta il banner del frontend. Il nome del ConfigMap cambia (hash del contenuto):
# il Deployment punta al nuovo nome e Kubernetes avvia da solo il rollout.
configMapGenerator:
  - name: frontend-config
    behavior: merge
    literals:
      - FRONTEND_MESSAGE=Ambiente di test locale - challenge L2
