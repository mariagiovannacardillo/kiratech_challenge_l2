apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: challenge-l2

resources:
  - ../../base

patches:
  # 1. Esclude il generatore di traffico
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
      $patch: delete

  # 2. Espone il frontend sulla porta 30000 impostata su Kind
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
      spec:
        type: NodePort
        ports:
          - name: http
            port: 80
            targetPort: 8080
            nodePort: 30000
