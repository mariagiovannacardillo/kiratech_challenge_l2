name: CI Validate Manifests
on: [push, pull_request]

jobs:
  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render di tutti gli overlay
        run: |
          for o in local demo-reconfig incident-1 incident-2; do
            echo "== overlay $o"
            kubectl kustomize k8s/overlays/$o > /dev/null
          done

      - name: Local - il loadgenerator non deve esserci
        run: |
          if kubectl kustomize k8s/overlays/local | grep -q loadgenerator; then
            echo "loadgenerator ancora presente nell'overlay local"; exit 1
          fi

      - name: Demo-reconfig - il banner deve essere impostato
        run: |
          kubectl kustomize k8s/overlays/demo-reconfig | grep -q "FRONTEND_MESSAGE: Ambiente di test locale"

      - name: Validate Incident 1 - il frontend usa un tag inesistente
        run: kubectl kustomize k8s/overlays/incident-1 | grep -q "tag-inesistente"

      - name: Validate Incident 2 - il selector di productcatalogservice è errato
        run: kubectl kustomize k8s/overlays/incident-2 | grep -q "productcatalog-rotto"